global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API rodando no docker compose local
  - job_name: api-local
    static_configs:
      - targets: ["api:8000"]

  # API publicada na Azure. Troque pelo host do output "url" do Terraform (sem https://)
  - job_name: api-nuvem
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["SEU-APP.REGIAO.azurecontainerapps.io"]
