name: CI-CD

on:
  push:
    branches: [main, "teste-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r app/requirements-dev.txt
      - name: Testes (pytest)
        run: cd app && pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (segredos no código)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (SAST)
        run: semgrep scan --config p/python --config p/dockerfile --error

  imagem-e-deploy:
    needs: [testes, gitleaks, semgrep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem (GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Trivy - vulnerabilidades da imagem
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/work -w /work aquasec/trivy:latest \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE:${{ github.sha }}"

      - name: Trivy - configuração (Dockerfile e Terraform)
        run: |
          docker run --rm -v "$PWD":/work aquasec/trivy:latest \
            config --exit-code 1 --severity HIGH,CRITICAL /work

      - name: Login no GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem no GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Só roda depois que você criar a variável DEPLOY_ENABLED=true e o secret AZURE_CREDENTIALS
      - name: Login na Azure
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy (troca a imagem do Container App)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update --name encosta-api --resource-group rg-encosta-viva \
            --image "$IMAGE:${{ github.sha }}"
